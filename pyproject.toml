[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelium-scorer"
version = "0.1.0"
description = "Benchmark-conditioned metrics for hallucination span localization"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Julia Belikova"},
  {name = "Elisei Rykov"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
include = ["mycelium*"]
